name: Daily Multi-Source Football Predictions
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python update_picks.py
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - run: |
          git config user.name "PitchPulse Bot"
          git config user.email "bot@pitchpulse.io"
          git add predictions.json
          git commit -m "Update live multi-source predictions" || exit 0
          git push
