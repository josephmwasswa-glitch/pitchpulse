<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PitchPulse — Live Multi-Source Consensus Predictions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1E3A3A">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            alabaster: '#F8FAFC',
            slateCard: '#FFFFFF',
            forestSlate: '#1E3A3A',
            sageGreen: '#2E7D6B',
            warmAmber: '#D97706',
            charcoal: '#0F172A',
            coolGray: '#475569'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-alabaster text-charcoal min-h-screen font-sans antialiased flex flex-col">

  <div class="bg-forestSlate text-white text-xs py-2 px-4 text-center font-medium flex items-center justify-center gap-2">
    <span class="inline-block w-2 h-2 rounded-full bg-sageGreen animate-pulse"></span>
    <span>Live Multi-Source Engine Active • SoccerVista, Sports Mole, Forebet & AI</span>
  </div>

  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer">
        <div class="w-10 h-10 rounded-xl bg-forestSlate flex items-center justify-center text-white shadow-md">
          <svg class="w-6 h-6 text-sageGreen" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
          </svg>
        </div>
        <div>
          <h1 class="font-bold text-lg text-forestSlate tracking-tight leading-none">PitchPulse</h1>
          <span class="text-[10px] text-coolGray font-medium uppercase tracking-widest">Live Engine</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="alert('VIP Executive Unlocked')" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-warmAmber hover:bg-amber-700 text-white font-semibold text-sm shadow-md transition">
          <i data-lucide="crown" class="w-4 h-4"></i> Go VIP
        </button>
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
    <div class="flex items-center justify-between bg-white p-3 rounded-2xl border border-slate-200 shadow-sm overflow-x-auto">
      <div class="flex items-center gap-2">
        <i data-lucide="calendar" class="w-4 h-4 text-sageGreen"></i>
        <span class="text-xs font-bold text-forestSlate">Fixture Schedule:</span>
      </div>
      <div id="day-tabs-container" class="flex items-center gap-2"></div>
    </div>

    <section id="view-predictions" class="space-y-6">
      <div id="matches-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        <div class="col-span-full py-12 text-center text-coolGray bg-white rounded-2xl border border-slate-200">Loading live matches...</div>
      </div>
    </section>
  </main>

  <script>
    lucide.createIcons();

    const todayDate = new Date();
    const dateMap = {
      0: todayDate.toISOString().split('T')[0],
      1: new Date(todayDate.getTime() + 86400000).toISOString().split('T')[0],
      2: new Date(todayDate.getTime() + 172800000).toISOString().split('T')[0]
    };

    let selectedDayIndex = 0;
    let masterFixtures = {};

    async function initApp() {
      try {
        const res = await fetch('./predictions.json?t=' + Date.now());
        const data = await res.json();
        masterFixtures = data.fixtures_by_date || {};
      } catch (err) {
        console.error("Using fallback data:", err);
      }
      renderDayTabs();
      renderMatches();
    }

    function renderDayTabs() {
      const container = document.getElementById("day-tabs-container");
      const labels = ["Today", "Tomorrow", "In 2 Days"];
      container.innerHTML = [0, 1, 2].map(i => `
        <button onclick="switchDay(${i})" class="px-3 py-1.5 rounded-xl text-xs font-bold transition ${selectedDayIndex === i ? 'bg-forestSlate text-white shadow-sm' : 'bg-slate-100 text-coolGray hover:bg-slate-200'}">
          ${labels[i]} (${dateMap[i]})
        </button>
      `).join('');
    }

    function switchDay(index) {
      selectedDayIndex = index;
      renderDayTabs();
      renderMatches();
    }

    function renderMatches() {
      const grid = document.getElementById("matches-grid");
      const currentDateKey = dateMap[selectedDayIndex];
      const dayFixtures = masterFixtures[currentDateKey] || [];

      if (dayFixtures.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-12 text-center text-coolGray bg-white rounded-2xl border border-slate-200">No fixtures available for ${currentDateKey}. Run your GitHub Actions workflow to populate data.</div>`;
        return;
      }

      grid.innerHTML = dayFixtures.map(m => `
        <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm space-y-4 relative">
          ${m.vip ? `<div class="absolute top-0 right-0 bg-warmAmber text-white text-[10px] font-bold px-3 py-1 rounded-bl-xl">VIP</div>` : ''}
          <div class="flex justify-between items-center text-[11px] text-coolGray font-medium">
            <span>${m.league}</span>
            <span class="text-forestSlate font-semibold">${m.time}</span>
          </div>
          <div class="text-center py-1 space-y-1.5">
            <div class="font-bold text-forestSlate text-base">${m.home} vs ${m.away}</div>
            <div class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-50 text-sageGreen border border-emerald-200">
              <i data-lucide="check-circle-2" class="w-3 h-3"></i> ${m.consensusCount}/4 Sources Agree
            </div>
          </div>
          <div class="bg-alabaster rounded-xl p-3 border border-slate-200 flex items-center justify-between">
            <div>
              <div class="text-[10px] text-coolGray font-bold uppercase">Consensus Pick</div>
              <div class="text-sm font-extrabold text-forestSlate">${m.tip}</div>
            </div>
            <div class="text-right">
              <div class="text-[10px] text-coolGray font-bold uppercase">Odds</div>
              <div class="text-sm font-black text-sageGreen">${m.odds}</div>
            </div>
          </div>
          <div class="bg-slate-50 rounded-xl p-3 border border-slate-100 space-y-1 text-[11px]">
            <div class="text-[10px] font-bold text-coolGray uppercase mb-1">Engine Breakdown:</div>
            <div class="flex justify-between"><span class="text-coolGray">SoccerVista:</span><span class="font-bold text-forestSlate">${m.sources.soccerVista}</span></div>
            <div class="flex justify-between"><span class="text-coolGray">Sports Mole:</span><span class="font-bold text-warmAmber">${m.sources.sportsMole}</span></div>
            <div class="flex justify-between"><span class="text-coolGray">Forebet:</span><span class="font-bold text-forestSlate">${m.sources.forebet}</span></div>
            <div class="flex justify-between"><span class="text-coolGray">PitchPulse AI:</span><span class="font-bold text-sageGreen">${m.sources.pitchPulse}</span></div>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    window.onload = initApp;
  </script>
</body>
</html>
